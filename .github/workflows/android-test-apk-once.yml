name: Home OS One-Shot Test APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk-once.yml'

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate safe Android launcher icons
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          sizes = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder, size in sizes.items():
              im = Image.new('RGB', (size, size), (31, 177, 192))
              d = ImageDraw.Draw(im)
              m = max(3, size // 8)
              # simple Home OS house mark for this test build
              d.polygon([(size//2,m),(size-m,size//2),(size-m,size-m),(m,size-m),(m,size//2)], fill=(235,249,250))
              door_w = max(4, size//5)
              d.rectangle([(size//2-door_w//2,size//2),(size//2+door_w//2,size-m)], fill=(42,111,126))
              target = Path('android/app/src/main/res') / folder / 'ic_launcher.png'
              target.parent.mkdir(parents=True, exist_ok=True)
              im.save(target, format='PNG', optimize=True)
              Image.open(target).verify()
              print(f'{target}: valid {size}x{size} PNG')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Restore dedicated test signing key
        run: |
          base64 --decode android/test-signing-keystore.b64 > android/app/test-signing-keystore.jks
          cat > android/key.properties <<'EOF'
          storePassword=homeos-test-only
          keyPassword=homeos-test-only
          keyAlias=homeos-test
          storeFile=test-signing-keystore.jks
          EOF

      - name: Verify test signing SHA-1
        run: |
          SIGNING_SHA1=$(keytool -list -v -keystore android/app/test-signing-keystore.jks -storepass homeos-test-only -alias homeos-test | awk -F': ' '/SHA1:/{print $2; exit}')
          test "$SIGNING_SHA1" = '3F:87:14:60:A2:89:D8:4D:3A:76:1A:A3:3D:76:C6:B7:27:55:41:00'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build signed test APK
        run: flutter build apk --release

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: home-os-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
